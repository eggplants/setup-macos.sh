[bootstrap.repos]
"~/.local/share/zsh/plugins/pure" = { url = "https://github.com/sindresorhus/pure" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.local/share/zsh/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions" }
"~/.local/share/zsh/plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting" }
"~/.local/share/zsh/plugins/history-search-multi-word" = { url = "https://github.com/zdharma-continuum/history-search-multi-word" }
"~/.local/share/nano-highlight" = { url = "https://github.com/serialhex/nano-highlight" }

[dotfiles]
"~/.zshenv" = { source = "dotfiles/zshenv" }
"~/.zshrc" = { source = "dotfiles/zshrc" }
"~/.gitconfig" = { source = "dotfiles/gitconfig" }
"~/.nanorc" = { source = "dotfiles/nanorc" }
"~/.gnupg/gpg-agent.conf" = { source = "dotfiles/gnupg/gpg-agent.conf", mode = "copy", permissions = "0600" }
"~/.config/ghostty/config" = { source = "dotfiles/ghostty/config" }

[bootstrap.mise_shell_activate]
zprofile = "shims"
bash = true

[bootstrap.user]
login_shell = "/bin/zsh"

# Replaces `brew services start colima`. colima/lima come from [tools]; the
# docker CLI (needed for the `colima` context) comes from the Homebrew prefix.
[bootstrap.services.colima]
scope = "user"
description = "Colima container runtime"
command = "~/.local/bin/mise exec -- colima start --foreground --cpu 8 --memory 16 --disk 160 --vm-type vz --mount-type virtiofs --vz-rosetta"
working_directory = "~"
environment = { PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin" }
restart = "on-failure"
requires_tools = true

[bootstrap.hooks]
# Stop the Homebrew-managed colima LaunchAgent before mise's own one starts.
post-tools = "bash {{ xdg_config_home }}/mise/scripts/stop-brew-colima.sh"

[tasks.bootstrap]
description = "Run imperative setup steps after the declarative bootstrap"
run = [
  { task = "setup:macos" },
  { task = "setup:gpg" },
  { task = "setup:git" },
  { task = "setup:docker" },
  { task = "setup:vscode" },
  { task = "setup:claude" },
]
